# Publish to PyPI on a version tag.
#
# One-time setup: add a PyPI Trusted Publisher for this repo
# (https://pypi.org/manage/account/publishing/) — no API token to store.
# Then: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests before publishing anything
        run: python -m unittest discover -s tests -t .
      - run: pip install build twine
      - run: python -m build
      - name: Check the distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
