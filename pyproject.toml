[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "burnrate"
version = "0.1.0"
description = "What your coding agent actually cost, and a cap to stop it before it costs more. Local, offline, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Erick Dronski" }]
keywords = ["claude-code", "ai-agents", "cost", "tokens", "observability", "cli", "llm", "budget"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/erickdronski/burnrate"
Issues = "https://github.com/erickdronski/burnrate/issues"

[project.scripts]
burnrate = "burnrate.cli:main"

[tool.setuptools.packages.find]
include = ["burnrate*"]
